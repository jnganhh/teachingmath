<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPM2D 800 Which One Doesn't Belong? (WODB)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    .comic-border {
      border: 3px solid #1e293b;
      box-shadow: 5px 5px 0px #1e293b;
    }
    .comic-btn {
      border: 2px solid #1e293b;
      box-shadow: 3px 3px 0px #1e293b;
      transition: all 0.12s ease;
    }
    .comic-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #1e293b;
    }
    .tab-active {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="bg-yellow-50 text-slate-900 font-sans min-h-screen p-3 sm:p-5 overflow-x-hidden">
  <div class="max-w-7xl mx-auto space-y-4">
    <!-- Top Header -->
    <header class="bg-white rounded-xl comic-border p-3.5 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <a href="index.html" class="px-2.5 py-1 text-xs font-black rounded-lg bg-slate-100 hover:bg-slate-200 border-2 border-slate-800">← Hub</a>
          <span class="px-2.5 py-1 text-xs font-black uppercase rounded bg-blue-100 text-blue-900 border-2 border-slate-800">Ontario MPM2D</span>
          <span class="px-2.5 py-1 text-xs font-black rounded bg-emerald-100 text-emerald-900 border-2 border-slate-800">800 WODB Puzzles</span>
        </div>
        <h1 class="text-xl sm:text-3xl font-black text-blue-700 mt-2">🤔 Which One Doesn't Belong? (800 MPM2D Set)</h1>
        <p class="text-xs font-bold text-slate-600">Every quadrant has a valid mathematical reason! Tap a card to tally class votes, then reveal reasons.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="pickRandomPuzzle()" class="px-3 py-2 text-xs font-black rounded-lg bg-amber-300 text-slate-900 comic-btn">
          🎲 Random WODB
        </button>
        <button onclick="toggleReasons()" id="reasonsToggleBtn" class="px-3 py-2 text-xs font-black rounded-lg bg-emerald-600 text-white comic-btn">
          👁️ Show Reasons
        </button>
        <button onclick="resetVotes()" class="px-3 py-2 text-xs font-black rounded-lg bg-slate-100 text-slate-900 comic-btn">
          🔄 Reset Votes
        </button>
        <button onclick="openCustomWodbModal()" class="px-3 py-2 text-xs font-black rounded-lg bg-purple-100 text-purple-900 comic-btn">
          ➕ Custom
        </button>
        <button onclick="toggleLargeFont()" id="fontBtn" class="px-3 py-2 text-xs font-black rounded-lg bg-slate-800 text-white comic-btn">
          ⛶ Large Font
        </button>
        <button onclick="hardRefreshApp()" class="px-3 py-2 text-xs font-black rounded-lg bg-cyan-100 text-cyan-950 comic-btn" title="Reload latest version">
          🔄 Refresh
        </button>
      </div>
    </header>

    <!-- Active WODB 2x2 Stage -->
    <section class="bg-white rounded-xl comic-border p-4 sm:p-6 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b-2 border-slate-200 pb-3">
        <div>
          <span id="activeUnitBadge" class="px-2 py-0.5 text-[10px] font-black uppercase rounded bg-blue-100 text-blue-900 border border-slate-800">Unit</span>
          <h2 id="activeTitle" class="text-lg sm:text-2xl font-black text-slate-900 mt-1">Puzzle Title</h2>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="stepPuzzle(-1)" class="px-3 py-1.5 text-xs font-black rounded-lg bg-slate-100 border-2 border-slate-800 hover:bg-slate-200">◀ Prev</button>
          <button onclick="stepPuzzle(1)" class="px-3 py-1.5 text-xs font-black rounded-lg bg-slate-100 border-2 border-slate-800 hover:bg-slate-200">Next ▶</button>
        </div>
      </div>

      <div id="wodbGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

    <!-- Expectation Filter, Search & Paginated 800-Puzzle Browser -->
    <section class="bg-white rounded-xl comic-border p-3 sm:p-4 space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5" id="unitFilterBar"></div>
        <div class="flex items-center gap-2">
          <input type="text" id="wodbSearch" oninput="onSearchChange()" placeholder="Search # (e.g. 250) or topic..." class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-50 border-2 border-slate-800 focus:outline-none w-48 sm:w-56" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2" id="puzzleSelectorGrid"></div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-200 text-xs font-black">
        <span id="pageInfo" class="text-slate-600">Showing 1–12 of 800</span>
        <div class="flex items-center gap-2">
          <button onclick="changePage(-1)" id="prevPageBtn" class="px-3 py-1 rounded-lg bg-slate-100 border-2 border-slate-800 hover:bg-slate-200 disabled:opacity-40">◀ Prev 12</button>
          <button onclick="changePage(1)" id="nextPageBtn" class="px-3 py-1 rounded-lg bg-slate-100 border-2 border-slate-800 hover:bg-slate-200 disabled:opacity-40">Next 12 ▶</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Custom WODB Modal -->
  <div id="customWodbModal" onclick="if(event.target===this) closeCustomWodbModal()" class="hidden fixed inset-0 z-40 bg-slate-900/75 flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white max-w-lg w-full rounded-2xl comic-border p-4 sm:p-5 space-y-3">
      <div class="flex items-center justify-between border-b-2 border-slate-200 pb-2">
        <h3 class="text-lg font-black">➕ Create Custom WODB</h3>
        <button onclick="closeCustomWodbModal()" class="px-2.5 py-1 text-xs font-black rounded-lg bg-slate-800 text-white">✕</button>
      </div>
      <input type="text" id="cwTitle" placeholder="Title (e.g., Quadratic Forms)" class="w-full px-3 py-2 text-xs font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="cwA" placeholder="Box A (e.g., $y = x^2 - 4$)" class="px-3 py-2 text-xs font-mono font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
        <input type="text" id="cwB" placeholder="Box B (e.g., $y = (x - 2)^2$)" class="px-3 py-2 text-xs font-mono font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
        <input type="text" id="cwC" placeholder="Box C (e.g., $y = -x^2 + 4$)" class="px-3 py-2 text-xs font-mono font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
        <input type="text" id="cwD" placeholder="Box D (e.g., $y = 2x^2 - 8$)" class="px-3 py-2 text-xs font-mono font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
      </div>
      <div class="grid grid-cols-1 gap-1.5">
        <input type="text" id="cwRA" placeholder="Reason A doesn't belong (optional)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
        <input type="text" id="cwRB" placeholder="Reason B doesn't belong (optional)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
        <input type="text" id="cwRC" placeholder="Reason C doesn't belong (optional)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
        <input type="text" id="cwRD" placeholder="Reason D doesn't belong (optional)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-50 border-2 border-slate-800" />
      </div>
      <button onclick="saveCustomWodb()" class="w-full py-2.5 text-xs font-black rounded-xl bg-emerald-600 text-white comic-btn">💾 Save &amp; Present</button>
    </div>
  </div>

  <script>
    function fmtSign(n) { return n >= 0 ? `+ ${n}` : `- ${Math.abs(n)}`; }
    function fmtTermX(b) {
      if (b === 0) return '';
      if (b === 1) return '+ x';
      if (b === -1) return '- x';
      return b > 0 ? `+ ${b}x` : `- ${Math.abs(b)}x`;
    }

    // Deterministic generator producing 800 distinct MPM2D WODB puzzles (200 per Expectation A, B, C, D)
    function generate800Puzzles() {
      const list = [];
      let num = 1;

      // EXPECTATION A (1–200): Quadratic Expressions (Expanding & Factoring)
      // A1: 100 puzzles — Four Quadratic Expressions
      for (let i = 0; i < 100; i++) {
        const r = (i % 10) + 2;
        const p = Math.floor(i / 10) + 1;
        const m = (i % 7) + 1;
        const n = ((i + 3) % 8) + 2;
        const bSum = m + n;
        const cProd = m * n;
        const k = (i % 5) + 2;
        const q = (i % 6) + 2;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp A: Factoring & Expanding',
          title: `#${num} — Four Quadratic Expressions`,
          items: [
            { label: 'A', expr: `$x^2 - ${r * r}$`, reason: `Only difference of squares: $(x - ${r})(x + ${r})$ (2 terms, $b = 0$).` },
            { label: 'B', expr: `$x^2 + ${2 * p}x + ${p * p}$`, reason: `Only perfect square trinomial: $(x + ${p})^2$.` },
            { label: 'C', expr: `$x^2 + ${bSum}x + ${cProd}$`, reason: `Only trinomial with two distinct factors: $(x + ${m})(x + ${n})$.` },
            { label: 'D', expr: `$${k}x^2 + ${k * q}x$`, reason: `Only one with a GCF ($${k}x$) and constant term $c = 0$.` }
          ]
        });
        num++;
      }

      // A2: 100 puzzles — Four Factored / Product Expressions
      for (let i = 0; i < 100; i++) {
        const a = (i % 9) + 1;
        const b = (Math.floor(i / 9) % 8) + 2;
        const bUse = b === a ? b + 1 : b;
        const c = (i % 4) + 2;
        const d = ((i + 1) % 5) + 1;
        const k = (i % 3) + 2;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp A: Factoring & Expanding',
          title: `#${num} — Four Binomial Products`,
          items: [
            { label: 'A', expr: `$(x + ${a})(x + ${bUse})$`, reason: `Only one with two distinct positive constants (expands to $x^2 + ${a + bUse}x + ${a * bUse}$).` },
            { label: 'B', expr: `$(x - ${a})(x + ${a})$`, reason: `Only conjugate pair (expands to difference of squares $x^2 - ${a * a}$ with no $x$ term).` },
            { label: 'C', expr: `$(${c}x + ${d})^2$`, reason: `Only squared binomial with leading coefficient $> 1$ (leading term $${c * c}x^2$).` },
            { label: 'D', expr: `$${k}(x + ${a})(x - ${bUse})$`, reason: `Only expression with a numerical GCF ($${k}$) factored out in front.` }
          ]
        });
        num++;
      }

      // EXPECTATION B (201–400): Quadratic Equations & Relations
      // B1: 100 puzzles — Four Parabolas
      for (let i = 0; i < 100; i++) {
        const r = (i % 8) + 2;
        const h = (Math.floor(i / 8) % 9) + 1;
        const k = (i % 7) + 1;
        const a = (i % 4) + 2;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp B: Quadratic Relations',
          title: `#${num} — Four Parabolas`,
          items: [
            { label: 'A', expr: `$y = x^2 - ${r * r}$`, reason: `Only one in standard form with $2$ $x$-intercepts at $x = \\pm ${r}$.` },
            { label: 'B', expr: `$y = (x - ${h})^2$`, reason: `Only parabola with exactly $1$ $x$-intercept (vertex on the $x$-axis at $(${h}, 0)$).` },
            { label: 'C', expr: `$y = -x^2 + ${k}$`, reason: `Only parabola that opens downward ($a = -1 < 0$, has a maximum).` },
            { label: 'D', expr: `$y = ${a}(x - ${h})^2 + ${k}$`, reason: `Only parabola with vertical stretch $a = ${a}$ AND $0$ $x$-intercepts.` }
          ]
        });
        num++;
      }

      // B2: 100 puzzles — Four Quadratic Equations
      for (let i = 0; i < 100; i++) {
        const r1 = (i % 7) + 1;
        const r2 = (Math.floor(i / 7) % 7) + 2;
        const r2Use = r2 === r1 ? r2 + 1 : r2;
        const s = (i % 9) + 2;
        const p = (i % 6) + 1;
        const q = (Math.floor(i / 6) % 5) + 1;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp B: Quadratic Relations',
          title: `#${num} — Four Quadratic Equations`,
          items: [
            { label: 'A', expr: `$(x - ${r1})(x - ${r2Use}) = 0$`, reason: `Only equation already in factored form (roots immediately $x = ${r1}, ${r2Use}$).` },
            { label: 'B', expr: `$x^2 - ${s * s} = 0$`, reason: `Only equation with symmetric opposite roots $x = \\pm ${s}$.` },
            { label: 'C', expr: `$x^2 ${fmtTermX(-(r1 + r2Use))} + ${r1 * r2Use} = 0$`, reason: `Only unfactored standard trinomial with $2$ real roots ($x = ${r1}, ${r2Use}$).` },
            { label: 'D', expr: `$(x + ${p})^2 + ${q} = 0$`, reason: `Only equation with NO real solutions (since $(x + ${p})^2 \\ge 0$).` }
          ]
        });
        num++;
      }

      // EXPECTATION C (401–600): Linear Systems
      // C1: 100 puzzles — Four Linear Equations
      for (let i = 0; i < 100; i++) {
        const m = (i % 8) + 2;
        const b = (Math.floor(i / 8) % 9) + 1;
        const d = (i % 7) + 2;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp C: Linear Systems',
          title: `#${num} — Four Linear Equations`,
          items: [
            { label: 'A', expr: `$y = ${m}x + ${b}$`, reason: `Only one in slope-intercept form with positive slope AND positive $y$-intercept.` },
            { label: 'B', expr: `$y = -${m}x + ${b}$`, reason: `Only line with a negative slope ($m = -${m}$).` },
            { label: 'C', expr: `$${m}x - y = -${b}$`, reason: `Only equation in standard form (and it represents the exact same line as A!).` },
            { label: 'D', expr: `$y = ${m}x - ${d}$`, reason: `Only line with a negative $y$-intercept ($b = -${d}$, parallel to A).` }
          ]
        });
        num++;
      }

      // C2: 100 puzzles — Four Linear Systems
      for (let i = 0; i < 100; i++) {
        const m = (i % 5) + 2;
        const b1 = (Math.floor(i / 5) % 6) + 1;
        const b2 = b1 + ((i % 4) + 2);
        const xSol = (i % 6) + 2;
        const ySol = (Math.floor(i / 6) % 5) + 1;
        const sum = xSol + ySol;
        const diff = xSol - ySol;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp C: Linear Systems',
          title: `#${num} — Four Linear Systems`,
          items: [
            { label: 'A', expr: `$y = ${m}x + ${b1}$ & $y = ${m}x + ${b2}$`, reason: `Only system with NO solution (parallel distinct lines).` },
            { label: 'B', expr: `$y = ${m}x + ${b1}$ & $${2 * m}x - 2y = -${2 * b1}$`, reason: `Only system with INFINITELY many solutions (coincident lines).` },
            { label: 'C', expr: `$y = ${m}x + ${b1}$ & $y = -\\frac{1}{${m}}x + ${b2}$`, reason: `Only pair of perpendicular lines (negative reciprocal slopes).` },
            { label: 'D', expr: `$x + y = ${sum}$ & $x - y = ${diff}$`, reason: `Only system where neither equation has $y$ isolated (POI: $(${xSol}, ${ySol})$).` }
          ]
        });
        num++;
      }

      // EXPECTATION D (601–800): Analytic Geometry & Trigonometry
      // D1: 100 puzzles — Circles & Points
      for (let i = 0; i < 100; i++) {
        const triples = [[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]];
        const t = triples[i % triples.length];
        const scale = Math.floor(i / triples.length) % 4 + 1;
        const px = t[0] * scale;
        const py = t[1] * scale;
        const r = t[2] * scale;
        const nonSq = r * r + ((i % 5) + 2);
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp D: Analytic & Trig',
          title: `#${num} — Circles & Coordinate Points`,
          items: [
            { label: 'A', expr: `$x^2 + y^2 = ${r * r}$`, reason: `Only circle equation with an integer radius ($r = ${r}$).` },
            { label: 'B', expr: `$x^2 + y^2 = ${nonSq}$`, reason: `Only circle with an irrational radius ($r = \\sqrt{${nonSq}}$).` },
            { label: 'C', expr: `$(${px}, ${py})$`, reason: `Only point in Quadrant I (lies directly on circle $x^2 + y^2 = ${r * r}$).` },
            { label: 'D', expr: `$(0, -${r})$`, reason: `Only point on an axis ($y$-intercept of $x^2 + y^2 = ${r * r}$).` }
          ]
        });
        num++;
      }

      // D2: 100 puzzles — Trigonometry & Line Segments
      for (let i = 0; i < 100; i++) {
        const k = (i % 10) + 1;
        const angleA = [30, 45, 60][i % 3];
        const compA = 90 - angleA;
        const s = (i % 7) + 2;
        list.push({
          id: `wodb-${num}`,
          num,
          unit: 'Exp D: Analytic & Trig',
          title: `#${num} — Trig Ratios & Exact Values`,
          items: [
            { label: 'A', expr: `$\\sin(${angleA}^\\circ)$`, reason: `Only sine expression.` },
            { label: 'B', expr: `$\\cos(${compA}^\\circ)$`, reason: `Only cosine expression (equals $\\sin(${angleA}^\\circ)$!).` },
            { label: 'C', expr: `$\\tan(45^\\circ) \\cdot ${k}$`, reason: `Only tangent expression (evaluates to integer $${k}$).` },
            { label: 'D', expr: `$${s}\\sqrt{2}$`, reason: `Only expression written as a simplified radical (hypotenuse of a ${s}-${s}-${s}\\sqrt{2}$ triangle).` }
          ]
        });
        num++;
      }

      return list;
    }

    const BUILTIN_WODB = generate800Puzzles();
    const CUSTOM_WODB_KEY = 'mpm2d_custom_wodb_v1';
    let customWodb = JSON.parse(localStorage.getItem(CUSTOM_WODB_KEY) || '[]');
    let activeUnit = 'All';
    let activeId = BUILTIN_WODB[0].id;
    let showReasons = false;
    let largeFont = false;
    let currentPage = 0;
    const PAGE_SIZE = 12;
    let votes = { A: 0, B: 0, C: 0, D: 0 };

    function getAllPuzzles() { return [...customWodb, ...BUILTIN_WODB]; }
    function getFilteredPuzzles() {
      const q = (document.getElementById('wodbSearch')?.value || '').trim().toLowerCase();
      return getAllPuzzles().filter(p => {
        const unitOk = activeUnit === 'All' || p.unit === activeUnit;
        if (!unitOk) return false;
        if (!q) return true;
        return p.title.toLowerCase().includes(q) || p.unit.toLowerCase().includes(q) || String(p.num || '') === q.replace('#', '');
      });
    }
    function getActivePuzzle() { return getAllPuzzles().find(p => p.id === activeId) || BUILTIN_WODB[0]; }

    function renderUnitFilters() {
      const units = ['All', 'Exp A: Factoring & Expanding', 'Exp B: Quadratic Relations', 'Exp C: Linear Systems', 'Exp D: Analytic & Trig'];
      if (customWodb.length > 0) units.push('Custom');
      document.getElementById('unitFilterBar').innerHTML = units.map(u => `
        <button onclick="setUnitFilter('${u}')" class="px-2.5 py-1 text-[11px] font-black rounded-lg border-2 border-slate-800 transition ${activeUnit === u ? 'tab-active' : 'bg-slate-50 hover:bg-slate-100'}">${u}</button>
      `).join('');
    }

    function setUnitFilter(u) {
      activeUnit = u;
      currentPage = 0;
      renderUnitFilters();
      renderSelector();
    }

    function onSearchChange() {
      currentPage = 0;
      renderSelector();
    }

    function changePage(delta) {
      const total = getFilteredPuzzles().length;
      const maxPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
      currentPage = Math.max(0, Math.min(maxPage, currentPage + delta));
      renderSelector();
    }

    function renderSelector() {
      const filtered = getFilteredPuzzles();
      const total = filtered.length;
      const start = currentPage * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById('puzzleSelectorGrid').innerHTML = slice.map(p => `
        <button onclick="selectPuzzle('${p.id}')" class="text-left p-2.5 rounded-xl border-2 border-slate-800 transition ${p.id === activeId ? 'bg-blue-50 ring-2 ring-blue-500' : 'bg-slate-50 hover:bg-yellow-50'}">
          <div class="text-[10px] font-black uppercase text-blue-700">${p.unit}</div>
          <div class="text-xs font-black text-slate-900 mt-0.5">${p.title}</div>
        </button>
      `).join('') || `<div class="col-span-full text-center py-4 text-xs font-bold text-slate-500">No matching WODB puzzles found.</div>`;

      const end = Math.min(start + PAGE_SIZE, total);
      document.getElementById('pageInfo').textContent = total > 0 ? `Showing ${start + 1}–${end} of ${total}` : '0 puzzles';
      document.getElementById('prevPageBtn').disabled = currentPage === 0;
      document.getElementById('nextPageBtn').disabled = end >= total;
    }

    function selectPuzzle(id) {
      activeId = id;
      votes = { A: 0, B: 0, C: 0, D: 0 };
      showReasons = false;
      updateReasonsBtn();
      renderSelector();
      renderStage();
    }

    function pickRandomPuzzle() {
      const filtered = getFilteredPuzzles();
      if (filtered.length === 0) return;
      const rand = filtered[Math.floor(Math.random() * filtered.length)];
      selectPuzzle(rand.id);
    }

    function stepPuzzle(delta) {
      const filtered = getFilteredPuzzles();
      if (filtered.length === 0) return;
      const idx = filtered.findIndex(p => p.id === activeId);
      const nextIdx = idx === -1 ? 0 : (idx + delta + filtered.length) % filtered.length;
      selectPuzzle(filtered[nextIdx].id);
    }

    function addVote(label, delta) {
      votes[label] = Math.max(0, (votes[label] || 0) + delta);
      const badge = document.getElementById(`voteBadge-${label}`);
      if (badge) badge.textContent = `Votes: ${votes[label]}`;
    }

    function resetVotes() {
      votes = { A: 0, B: 0, C: 0, D: 0 };
      ['A', 'B', 'C', 'D'].forEach(lbl => {
        const badge = document.getElementById(`voteBadge-${lbl}`);
        if (badge) badge.textContent = 'Votes: 0';
      });
    }

    function toggleReasons() {
      showReasons = !showReasons;
      updateReasonsBtn();
      renderStage();
    }

    function updateReasonsBtn() {
      const btn = document.getElementById('reasonsToggleBtn');
      btn.textContent = showReasons ? '🙈 Hide Reasons' : '👁️ Show Reasons';
    }

    function toggleLargeFont() {
      largeFont = !largeFont;
      document.getElementById('fontBtn').textContent = largeFont ? '⛶ Normal Font' : '⛶ Large Font';
      renderStage();
    }

    function renderStage() {
      const p = getActivePuzzle();
      document.getElementById('activeUnitBadge').textContent = p.unit;
      document.getElementById('activeTitle').textContent = p.title;

      const exprClass = largeFont ? 'text-2xl sm:text-4xl' : 'text-xl sm:text-2xl';
      const colors = ['bg-blue-50', 'bg-emerald-50', 'bg-amber-50', 'bg-purple-50'];

      document.getElementById('wodbGrid').innerHTML = p.items.map((item, idx) => {
        const v = votes[item.label] || 0;
        return `
          <div onclick="addVote('${item.label}', 1)" class="cursor-pointer ${colors[idx % 4]} rounded-2xl comic-border p-5 sm:p-7 flex flex-col justify-between min-h-[170px] sm:min-h-[210px] hover:brightness-95 transition">
            <div class="flex items-center justify-between">
              <span class="w-8 h-8 rounded-full bg-slate-900 text-white text-sm font-black flex items-center justify-center">${item.label}</span>
              <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                <button onclick="addVote('${item.label}', -1)" class="px-2 py-0.5 text-xs font-black rounded bg-white border-2 border-slate-800 hover:bg-slate-100" aria-label="Remove vote for ${item.label}">−</button>
                <span id="voteBadge-${item.label}" class="px-2.5 py-0.5 text-xs font-mono font-black rounded bg-white border-2 border-slate-800">Votes: ${v}</span>
              </div>
            </div>
            <div class="${exprClass} font-black text-center text-slate-900 my-4 break-words">${item.expr}</div>
            ${showReasons && item.reason ? `
              <div class="p-2.5 rounded-xl bg-white/90 border-2 border-slate-800 text-xs font-bold text-slate-800">
                💡 ${item.reason}
              </div>
            ` : `<div class="text-[11px] font-bold text-slate-500 text-center">Why might ${item.label} not belong?</div>`}
          </div>
        `;
      }).join('');

      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.getElementById('wodbGrid'), {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function openCustomWodbModal() { document.getElementById('customWodbModal').classList.remove('hidden'); }
    function closeCustomWodbModal() { document.getElementById('customWodbModal').classList.add('hidden'); }
    function saveCustomWodb() {
      const title = document.getElementById('cwTitle').value.trim();
      const a = document.getElementById('cwA').value.trim();
      const b = document.getElementById('cwB').value.trim();
      const c = document.getElementById('cwC').value.trim();
      const d = document.getElementById('cwD').value.trim();
      if (!title || !a || !b || !c || !d) { alert('Please fill in the title and all 4 boxes.'); return; }
      const newP = {
        id: 'cw-' + Date.now(),
        unit: 'Custom',
        title,
        items: [
          { label: 'A', expr: a, reason: document.getElementById('cwRA').value.trim() },
          { label: 'B', expr: b, reason: document.getElementById('cwRB').value.trim() },
          { label: 'C', expr: c, reason: document.getElementById('cwRC').value.trim() },
          { label: 'D', expr: d, reason: document.getElementById('cwRD').value.trim() }
        ]
      };
      customWodb.unshift(newP);
      localStorage.setItem(CUSTOM_WODB_KEY, JSON.stringify(customWodb));
      closeCustomWodbModal();
      activeUnit = 'All';
      currentPage = 0;
      renderUnitFilters();
      selectPuzzle(newP.id);
    }

    function hardRefreshApp() {
      const url = new URL(window.location.href);
      url.searchParams.set('_r', Date.now());
      window.location.replace(url.toString());
    }

    renderUnitFilters();
    renderSelector();
    renderStage();
    window.addEventListener('load', renderStage);
  </script>
</body>
</html>
